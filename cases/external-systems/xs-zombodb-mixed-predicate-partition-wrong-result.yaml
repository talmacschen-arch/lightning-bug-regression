id: xs-zombodb-mixed-predicate-partition-wrong-result
title: ZomboDB ==> 与等价常规查询结果不一致（分区表 + 数组谓词 + 常规 IN 过滤返回 0 行）
category: external_systems
status: open
severity: high
destructive: false

source:
  feishu_anchor: "section-zombodb-vs-equivalent-mixed-predicate-202608"
  reported_at: "2026-08-08"
  fixed_version: ""
  ext_doc_url: "https://github.com/zombodb/zombodb"
issue_url: ""
tags: [external_systems, zombodb, elasticsearch, partition, array_predicate, wrong_result, mixed_predicate]

description: |
  ZomboDB (PG ↔ Elasticsearch 桥接 extension) 在**分区表**上，用 ZQL `==>` 数组
  谓词 **叠加一个常规 SQL 谓词**（分区键 `etl_ldup_dt IN (...)`）时，返回 **0 行**——
  但语义完全等价的常规查询（GIN 数组重叠 `&&` + 同一 `IN` 过滤）返回 **130 行**。
  两者应当结果一致，属结果错误（wrong result），非报错。

  复现规模（完全确定性，取模造数，重跑一致）：
    - 分区表 tb_mpmab_glob_crcr_cell_trc_s：ao_row + zstd，按 etl_ldup_dt RANGE
      分区（p202601~p202607 + DEFAULT），7 个 2026 月分区各灌 10,000 行 = 70,000 行；
    - 每分区按 rn%5 分 5 桶，GOLDEN 桶（rn%5=0）的 lot_id_ary_ctn 恰含 3 个 ANCHOR
      {BC5F318090, BC5F319091, BC5F319092}，且 ANCHOR 只出现在 GOLDEN 行；
    - 目标查询：lot_id_ary_ctn 命中任一 ANCHOR 且 etl_ldup_dt ∈ {20260319, 20260320}
      → 确定性命中 130 行（20260319:65 + 20260320:65）。

  索引：BTREE(fin_trc_id/row_id) + GIN(lot_id_ary_ctn 等) +
  zombodb((表.*))（建索引时把全表同步到外部 ES）。

procedure: |
  1) precondition (step 1): curl ES /_cluster/health → 期望 "status" : "green"
     （非 green 视为外部依赖未就绪，case 立即 fail，后续 step 不跑）
  2) setup: DROP 旧表 + CREATE SCHEMA + DROP+CREATE EXTENSION zombodb（强制重装扩展 SQL 对象；
     注意 CASCADE 会连带删除全库所有 zombodb 索引，仅在换过新 .so 后需要重装时使用）
  3) step 2: 建分区表
  4) step 3: 灌 70,000 行确定性数据（先建 324 个 LOT 池，再主灌）
  5) step 4: 建 BTREE + GIN 索引
  6) step 5: 建 zombodb 索引（同步 7 万行到 ES）
  7) step 6: ANALYZE（kind: shell + psql -c，非事务安全 DDL 走 shell）
  8) step 7: sanity 全表行数 == 70000
  9) step 8: 对照组——常规 `&&` + `IN` 查询 == 130（真值锚点，应通过）
  10) step 9: 绕行组——把 IN 条件也下推到 ES 的 ZQL == 130（记录 workaround，应通过）
  11) step 10: **BUG 步**——ZQL `==>` 数组谓词 + 常规 `etl_ldup_dt IN`，强制 3 种扫描
      计划（Seq Scan Filter / Bitmap Recheck / 索引优先）各跑一次，聚合为单一 scalar，
      三者全部 == 130 才通过（旧构建下部分计划返回 0 → 断言失败 → 复现 bug；避免单次
      运行因计划抖动侥幸绿）

expected: |
  - ES 健康检查 stdout 含 `"status" : "green"`
  - 建表 / 灌数 / 建索引 / ANALYZE 全程无 ERROR / FATAL
  - 全表行数 == 70000
  - 对照组常规查询 == 130（真值）
  - 绕行组 ZQL（IN 下推 ES）== 130
  - **BUG 步**：ZQL `==>` + 常规 IN，3 种扫描计划各跑一次**全部期望 == 130**（聚合 scalar==130）；
    旧构建下至少一种计划返回 0 → 失败（复现中）；修复后三者应稳定 == 130。

applies_to: {}
preconditions: {}
external_deps: [elasticsearch]

defaults:
  database: gpadmin

sessions: {}

setup:
  - DROP TABLE IF EXISTS mfg_m.tb_mpmab_glob_crcr_cell_trc_s CASCADE
  - DROP TABLE IF EXISTS mfg_m.zz_lot_pool
  - CREATE SCHEMA IF NOT EXISTS mfg_m
  - DROP EXTENSION IF EXISTS zombodb CASCADE
  - CREATE EXTENSION zombodb

steps:
  - name: "precondition: ES /_cluster/health status=green (失败则后续 step 跳)"
    kind: shell
    cmd: |
      su - gpadmin -c 'curl -m 10 -sS "{{ external.elasticsearch.extras.scheme }}://{{ external.elasticsearch.host }}:{{ external.elasticsearch.port }}/_cluster/health?pretty"'
    timeout_sec: 30
    expect:
      exit_code: 0
      stdout_contains: ['"status" : "green"']
      not_contains: ["FATAL", "Connection refused", "timed out"]

  - name: "建分区表 tb_mpmab_glob_crcr_cell_trc_s (ao_row + RANGE 分区)"
    kind: sql
    sql: |
      CREATE TABLE mfg_m.tb_mpmab_glob_crcr_cell_trc_s (
          row_id                text,
          frst_trc_id           text,
          fin_trc_id            text,
          proc_gr_id_ary_ctn    text[],
          plnt_cd_ary_ctn       text[],
          pldo_cd_ary_ctn       text[],
          ste_cd_ary_ctn        text[],
          ln_id_ary_ctn         text[],
          eqp_id_ary_ctn        text[],
          proc_id_ary_ctn       text[],
          dgas_divs_ary_ctn     text[],
          lot_id_ary_ctn        text[],
          lot_id_loc_ary_ctn    numeric[],
          cell_id_ary_ctn       text[],
          cell_id_loc_ary_ctn   numeric[],
          plt_id_ary_ctn        text[],
          otsd_box_id_ary_ctn   text[],
          prj_nm_ary_ctn        text[],
          schm_ary_ctn          text[],
          row_id_ary_ctn        text[],
          trc_id_ary_ctn        text[],
          etl_ldup_dt_ary_ctn   text[],
          loc_id                numeric,
          data_len              numeric,
          trc_row_id            text,
          proc_cnct_yn          text,
          wk_dt_ary_ctn         text[],
          data_ldup_dtm         timestamp without time zone,
          proc_divs_cd          text,
          etl_ldup_dt           text,
          jero_id_ary_ctn       text[],
          can_id_ary_ctn        text[]
      )
      USING ao_row
      WITH (compresstype = zstd, compresslevel = 7)
      DISTRIBUTED BY (row_id)
      PARTITION BY RANGE (etl_ldup_dt)
      (
          PARTITION p202601 START ('20260101') INCLUSIVE END ('20260201') EXCLUSIVE,
          PARTITION p202602 START ('20260201') INCLUSIVE END ('20260301') EXCLUSIVE,
          PARTITION p202603 START ('20260301') INCLUSIVE END ('20260401') EXCLUSIVE,
          PARTITION p202604 START ('20260401') INCLUSIVE END ('20260501') EXCLUSIVE,
          PARTITION p202605 START ('20260501') INCLUSIVE END ('20260601') EXCLUSIVE,
          PARTITION p202606 START ('20260601') INCLUSIVE END ('20260701') EXCLUSIVE,
          PARTITION p202607 START ('20260701') INCLUSIVE END ('20260801') EXCLUSIVE,
          DEFAULT PARTITION pothers
      );
