          lot_id_ary_ctn, lot_id_loc_ary_ctn, cell_id_ary_ctn, cell_id_loc_ary_ctn,
          plt_id_ary_ctn, otsd_box_id_ary_ctn, prj_nm_ary_ctn, schm_ary_ctn,
          row_id_ary_ctn, trc_id_ary_ctn, etl_ldup_dt_ary_ctn,
          loc_id, data_len, trc_row_id, proc_cnct_yn,
          wk_dt_ary_ctn, data_ldup_dtm, proc_divs_cd, etl_ldup_dt,
          jero_id_ary_ctn, can_id_ary_ctn
      )
      WITH pool AS (
          SELECT array_agg(lot_id ORDER BY seq) AS arr, count(*)::int AS n
            FROM mfg_m.zz_lot_pool
      ),
      months(ym, ndays) AS (
          VALUES ('202601',31), ('202602',28), ('202603',31), ('202604',30),
                 ('202605',31), ('202606',30), ('202607',31)
      ),
      g AS (
          SELECT m.ym, m.ndays, rn,
                 m.ym || lpad((1 + (rn - 1) % m.ndays)::text, 2, '0') AS etl_dt,
                 rn % 5 AS bucket
            FROM months m
           CROSS JOIN generate_series(1, 10000) AS rn
      )
      SELECT
          'RID_'    || g.ym || '_' || lpad(g.rn::text, 5, '0'),
          'FTRC_'   || g.ym || '_' || lpad(g.rn::text, 5, '0'),
          'LTRC_'   || g.ym || '_' || lpad(g.rn::text, 5, '0'),

          ARRAY['E','A','F','C'],                                  -- proc_gr  (含 'E')
          ARRAY['PL01','PL02'],                                    -- plnt_cd
          ARRAY['E3','E4'],                                        -- pldo_cd  (含 'E3')
          ARRAY['ST01'],                                           -- ste_cd

          CASE WHEN g.bucket = 3 THEN ARRAY['E3D99']               -- 反例: 不含 E3D01
               ELSE ARRAY['E3D01','E3D02'] END,                    -- ln_id

          ARRAY['M1EMIX201','M1EMIX202','M1EMIX203','M1EMIX204'],   -- eqp_id
          ARRAY['E1000','E1001'],                                  -- proc_id  (含 'E1000')
          ARRAY['DG1'],                                            -- dgas_divs

          -- ---------------- lot_id_ary_ctn ----------------
          CASE g.bucket
            WHEN 0 THEN ARRAY['BC5F318090','BC5F319091','BC5F319092']   -- GOLDEN: ANCHOR
            WHEN 4 THEN ARRAY['NOISE_' || g.ym || '_' || g.rn,
                              'NOISE_' || g.ym || '_' || (g.rn + 100000)]
            ELSE        ARRAY[ p.arr[1 + (g.rn * 3)  % p.n],
                               p.arr[1 + (g.rn * 7)  % p.n],
                               p.arr[1 + (g.rn * 13) % p.n] ]
          END,

          ARRAY[(g.rn % 50)::numeric, ((g.rn + 7) % 50)::numeric],
          ARRAY['CELL_' || g.ym || '_' || g.rn,
                'CELL_' || g.ym || '_' || (g.rn + 500000)],
          ARRAY[(g.rn % 30)::numeric],
          ARRAY['PLT_' || (g.rn % 40)],
          ARRAY['BOX_' || (g.rn % 25)],
          ARRAY['PRJ_TRACE'],
          ARRAY['MFG_M'],
          ARRAY['RK_E_' || g.rn, 'RK_A_' || g.rn,
                'RK_F_' || g.rn, 'RK_C_' || g.rn],                 -- 4 元素, SQL 取 [1]..[4]
          ARRAY['TRC_' || g.rn],
          ARRAY[g.etl_dt],

          (g.rn % 100)::numeric,
          (200 + g.rn % 800)::numeric,
          'TRCROW_' || g.ym || '_' || g.rn,

          CASE WHEN g.bucket = 2 THEN 'Y' ELSE NULL END,            -- 反例: 非 NULL

          ARRAY[g.etl_dt],
          (to_date(g.etl_dt,'YYYYMMDD') + (g.rn % 24) * interval '1 hour')::timestamp,
          'PD' || (g.rn % 5),
          g.etl_dt,
          ARRAY['JERO_' || (g.rn % 60)],
          ARRAY['CAN_'  || (g.rn % 60)]
        FROM g CROSS JOIN pool p;
    timeout_sec: 180
    expect:
      not_contains: ["ERROR", "FATAL"]

  - name: "建 BTREE + GIN 索引"
    kind: sql
    sql: |
      CREATE INDEX tb_mpmab_glob_crcr_cell_trc_s_idx101
          ON mfg_m.tb_mpmab_glob_crcr_cell_trc_s USING btree (fin_trc_id);
      -- 分区字段不建议建索引
      -- CREATE INDEX tb_mpmab_glob_crcr_cell_trc_s_idx102
      --     ON mfg_m.tb_mpmab_glob_crcr_cell_trc_s USING btree (etl_ldup_dt);
      CREATE INDEX tb_mpmab_glob_crcr_cell_trc_s_idx103
          ON mfg_m.tb_mpmab_glob_crcr_cell_trc_s USING btree (row_id);
      CREATE INDEX tb_mpmab_glob_crcr_cell_trc_s_idx104
          ON mfg_m.tb_mpmab_glob_crcr_cell_trc_s USING gin (lot_id_ary_ctn);
      CREATE INDEX tb_mpmab_glob_crcr_cell_trc_s_idx105
          ON mfg_m.tb_mpmab_glob_crcr_cell_trc_s USING gin (cell_id_ary_ctn);
    timeout_sec: 120
    expect:
      not_contains: ["ERROR", "FATAL"]

  - name: "建 zombodb 索引 (同步全表 7 万行到外部 ES，INFO 级日志可忽略)"
    kind: sql
    sql: |
      CREATE INDEX idx_zombodb ON mfg_m.tb_mpmab_glob_crcr_cell_trc_s
          USING zombodb ((tb_mpmab_glob_crcr_cell_trc_s.*))
          WITH (url='{{ external.elasticsearch.extras.scheme }}://{{ external.elasticsearch.host }}:{{ external.elasticsearch.port }}/');
    timeout_sec: 300
    expect:
      not_contains: ["ERROR", "FATAL"]

  - name: "ANALYZE (kind: shell + psql -c；顶层 ANALYZE 非事务安全走 shell)"
    kind: shell
    cmd: su - gpadmin -c "psql -d gpadmin -c 'ANALYZE mfg_m.tb_mpmab_glob_crcr_cell_trc_s'"
    timeout_sec: 120
    expect:
      exit_code: 0
      not_contains: ["ERROR", "FATAL"]

  - name: "sanity: 全表行数 == 70000 (确定性造数校验)"
    kind: sql
    sql: |
      SELECT count(*)::int AS n FROM mfg_m.tb_mpmab_glob_crcr_cell_trc_s;
    timeout_sec: 60
    expect:
      scalar: 70000
      not_contains: ["ERROR", "FATAL"]

  - name: "对照组: 常规 && + IN 查询 == 130 (真值锚点，应通过)"
    kind: sql
    sql: |
      SELECT count(*)::int AS hits
      FROM mfg_m.tb_mpmab_glob_crcr_cell_trc_s
      WHERE lot_id_ary_ctn && ARRAY['BC5F318090','BC5F319091','BC5F319092']::text[]
        AND etl_ldup_dt IN ('20260319','20260320');
    timeout_sec: 60
    expect:
      scalar: 130
      not_contains: ["ERROR", "FATAL"]

  - name: "绕行组: ZQL 把 IN 条件也下推 ES == 130 (workaround，应通过)"
    kind: sql
    sql: |
      set enable_seqscan to off;
      SELECT count(*)::int AS hits
      FROM mfg_m.tb_mpmab_glob_crcr_cell_trc_s S
      WHERE S ==> 'lot_id_ary_ctn:[BC5F318090,BC5F319091,BC5F319092] AND etl_ldup_dt:[20260319,20260320]';
    timeout_sec: 60
    expect:
      scalar: 130
      not_contains: ["ERROR", "FATAL"]

  - name: "BUG: ZQL ==> + 常规 etl_ldup_dt IN，3 种扫描计划各跑一次全须 == 130 (旧构建计划抖动会返回 0)"
    kind: sql
    sql: |
      -- 为什么不是「同一 query 跑 3 遍」：同一 session/事务内 stats 不变 → 计划相同 →
      -- 3 次结果必然一样，测不出跨运行的计划抖动（旧构建下 run 114=0 / run 115=130
      -- 就是计划抖动造成的假绿）。这里改为强制 3 种扫描策略各跑一次，覆盖 bug 会/
      -- 不会出现的三条路径，三者全部命中 130 才通过——确定性，不靠 planner 那次的选择。
      DROP TABLE IF EXISTS _zdb_mixed_check;
      CREATE TEMP TABLE _zdb_mixed_check (variant text, hits int);

      -- 1) Seq Scan Filter：==> 逐行 filter
      SET enable_seqscan TO on;  SET enable_indexscan TO off; SET enable_bitmapscan TO off;
      INSERT INTO _zdb_mixed_check
      SELECT 'seqscan_filter', count(*)::int
      FROM mfg_m.tb_mpmab_glob_crcr_cell_trc_s S
      WHERE S ==> 'lot_id_ary_ctn:[BC5F318090,BC5F319091,BC5F319092]'
        AND etl_ldup_dt IN ('20260319','20260320');

      -- 2) Bitmap Heap Recheck：==> 落 recheck
      SET enable_seqscan TO off; SET enable_indexscan TO off; SET enable_bitmapscan TO on;
      INSERT INTO _zdb_mixed_check
      SELECT 'bitmap_recheck', count(*)::int
      FROM mfg_m.tb_mpmab_glob_crcr_cell_trc_s S
      WHERE S ==> 'lot_id_ary_ctn:[BC5F318090,BC5F319091,BC5F319092]'
        AND etl_ldup_dt IN ('20260319','20260320');

      -- 3) 索引优先（seqscan off，索引/位图交给 planner）
      RESET enable_seqscan; RESET enable_indexscan; RESET enable_bitmapscan;
      SET enable_seqscan TO off;
      INSERT INTO _zdb_mixed_check
      SELECT 'index_preferred', count(*)::int
      FROM mfg_m.tb_mpmab_glob_crcr_cell_trc_s S
      WHERE S ==> 'lot_id_ary_ctn:[BC5F318090,BC5F319091,BC5F319092]'
        AND etl_ldup_dt IN ('20260319','20260320');

      RESET enable_seqscan; RESET enable_indexscan; RESET enable_bitmapscan;

      -- 单一 scalar（driver 只取最后一条结果集的首行首列）：3 种计划齐全且全部 ==130
      -- → 返回 130；任一 ≠130（尤其旧构建 recheck/filter 返回 0）→ 返回 min(hits) 触发断言失败。
      SELECT CASE WHEN count(*) = 3 AND min(hits) = 130 AND max(hits) = 130
                  THEN 130 ELSE min(hits) END::int AS hits
      FROM _zdb_mixed_check;
    timeout_sec: 120
    expect:
      scalar: 130
      not_contains: ["ERROR", "FATAL"]

teardown:
  - DROP TABLE IF EXISTS mfg_m.tb_mpmab_glob_crcr_cell_trc_s CASCADE
  - DROP TABLE IF EXISTS mfg_m.zz_lot_pool

created_by: chenqiang
created_at: "2026-08-10"
notes: |
  **现象**：ZomboDB `==>` 数组谓词与语义等价的常规查询在**分区表**上结果不一致。
    - ZQL：`S ==> 'lot_id_ary_ctn:[A,B,C]' AND etl_ldup_dt IN ('20260319','20260320')`
      → 返回 **0 行**（错误）
    - 常规：`lot_id_ary_ctn && ARRAY[A,B,C] AND etl_ldup_dt IN (...)`
      → 返回 **130 行**（正确，65+65）
  两者应一致。属**结果错误**（wrong result），psql 退出码恒 0，故必须用 `scalar`
  断言鉴别（见框架 crash/wrong-result 判定选型）。

  **回归契约**：BUG 步断言 `scalar: 130`（正确/修复后行为）。当前构建
  （HashData Lightning 2.5.3 build 147934 + zombodb 3000.1.8 + ES 7.10.2）
  返回 0 → 该步失败 → case verdict = fail → 忠实复现未修复的 bug。修复后返回 130
  → 通过。故 `status: open`。

  **步骤编排**：对照组(常规=130) / 绕行组(IN 下推 ES=130) 均在 BUG 步**之前**且应通过，
  BUG 步放**最后**——orchestrator 同 session 组内「首个非 pass 即 break 后续」，把预期
  失败的 BUG 步置尾，避免跳过其它断言；报告里可清楚看到「常规通了、zombodb 没通」。

  **确定性造数**：70,000 行 = 7 分区 × 10,000，取模分桶无 random，重跑结果一致；
  ANCHOR {BC5F318090,BC5F319091,BC5F319092} 只落 GOLDEN 桶(rn%5=0)，
  故 lot && ANCHOR 且 etl_ldup_dt ∈ {0319,0320} 命中恒为 130。

  **绕行方法**（生产可用）：把 `etl_ldup_dt` 过滤也写进 ZQL 下推到 ES，例如
  `... AND etl_ldup_dt:[20260319,20260320]`，或用 `dsl.and(dsl.terms(...), dsl.terms(...))`。

  **外部依赖**：
  - ES：`{{ external.elasticsearch.* }}`（external/elasticsearch.yml 注入，M6-5）；
    建 zombodb 索引 + ZQL 查询均需 ES 可达；step 1 健康检查非 green 则跳过后续。
  - zombodb extension 3000.1.8；DUT 走 external/dut.yml。

  **kind 选择 / cross-check #11**：建表 / 灌数 / 建索引 / SELECT 全 tx-safe → kind: sql；
  顶层 ANALYZE 非事务安全 → kind: shell + psql -c（与 bug-0011/0012 一致）。

  **teardown**：仅 DROP 自建两表；不 DROP EXTENSION zombodb、不 DROP SCHEMA mfg_m
  （共享资源，可能被其它 case / 业务依赖）。

  **索引设计决定**：分区键 `etl_ldup_dt` 上**不建** btree（原 idx102 已注释）。
  分区裁剪本身已覆盖对分区键的等值/范围过滤，再在分区键上单独建索引在
  Greenplum/Cloudberry 上通常无收益、且不被推荐。去掉它**不影响 bug 复现**：
  表为 ao_row，位图堆扫描恒 lossy → `==>` 必进 recheck；`enable_seqscan off`
  下仍由 zombodb 索引驱动 + recheck，BUG 步返回 0 的复现契约不变。对照组
  (`&&`+`IN`=130) 与绕行组 (ZQL 下推=130) 也都不依赖该索引。
