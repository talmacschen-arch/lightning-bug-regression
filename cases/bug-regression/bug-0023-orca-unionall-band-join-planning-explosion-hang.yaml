    -- ---- hdr_MCC_nXX (真实结构, 来自 \d+ ...assy_hdr_mcc_n01_f; n01~n11 结构一致) ----
    --   evt_dtm/crt_dtm 均为 timestamp -> 与 img 侧等值 join 类型一致(无隐式转换)
    --   多个 _ary_ctn 列 stats target=0 (建后用 ALTER SET STATISTICS 0 复原)
    SELECT format($SQL$
    DROP TABLE IF EXISTS esaz_mfg_m.tb_mspcb_spcp_isp_rlt_assy_hdr_mcc_%1$s_f CASCADE;
    CREATE TABLE esaz_mfg_m.tb_mspcb_spcp_isp_rlt_assy_hdr_mcc_%1$s_f (
