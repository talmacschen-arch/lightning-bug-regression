id: bug-0023-orca-unionall-band-join-planning-explosion-hang
title: ORCA(optimizer=on) 对多分支 UNION ALL 派生表施加范围(band)非等值连接谓词时计划生成阶段搜索空间爆炸致查询无法返回（optimizer=off 立即返回）
category: bug_regression
status: fixed
severity: high
destructive: false

source:
  feishu_anchor: "wiki/PylNw7UXXi6xP2kXGagcFkXKnng"
  reported_at: "2026-08-04"
  fixed_version: "HashData Lightning 2.5.3 build 147934"
  ext_doc_url: "https://hashdata.feishu.cn/wiki/PylNw7UXXi6xP2kXGagcFkXKnng"
issue_url: ""
tags: [orca, union-all, band-join, non-equijoin, range-predicate, planning-explosion, hang, temp-table, lg]

description: |
  语句② (f_fetch_mspcb_spcp_vald_inq_img_dtl_sql_v4)：11 段 UNION ALL(每段 hdr JOIN
  img) 构成派生表 t，再以范围(band)非等值谓词 t.evt_dtm BETWEEN AP.FROM_EVT_DTM AND
  AP.TO_EVT_DTM 连接临时表 AP(APD_SUMMARY_IMAGE_DATA)，末尾 JOIN eqp_n、LEFT JOIN
  eqp_mdp_n。

  根因(飞书内测/Broadcom 定位)：GPORCA 计划生成阶段搜索空间组合膨胀。当多分支 UNION
  ALL 派生表与范围(band)非等值连接谓词同时出现时，ORCA 会把该连接及不等值谓词沿 UNION
  ALL 下推至各分支、对无法转成 hash 条件的不等值部分枚举大量 NL 连接与分发候选，规模
  随分支数呈超线性增长，Memo/transform 搜索空间爆炸 → 计划生成无法在可接受时间内收敛
  ("连 EXPLAIN 都出不来")。**与数据量/统计信息无关，空表即可复现**。
    - optimizer=on(GPORCA): 卡住/无法返回(计划阶段爆炸)；
    - optimizer=off(Postgres planner): 不做跨 UNION ALL 连接变换枚举，物化 Append 后
      一次性 hash join，立即返回(~15ms)。
  规避：SET optimizer=off，或先把 UNION ALL 物化成临时表再做范围连接。调
  optimizer_join_order(query/greedy) 无效(仍 ~58s，不可用)。

procedure: |
  1) setup: 建独占库 bug0023_lgdb + schema esaz_mfg/esaz_mfg_m + 源表 smry_img_f(分区) +
     维表 eqp_n/eqp_mdp_n + 11 套 hdr/img_mcc_nXX_f(分区, \gexec 生成)；**全部空表**
     (planning 爆炸与数据无关，空表即可复现)；hdr 的 _ary_ctn 列 SET STATISTICS 0(对齐真实)；
  2) 每个断言步(独立 session)在**单个 psql 会话**内：先 optimizer=off 建空临时表
     APD_SUMMARY_IMAGE_DATA(语句①)并 ANALYZE，再 SET 待测 optimizer + statement_timeout=30s，
     对语句② 跑 **EXPLAIN**(仅计划生成——正是"连 explain 都出不来"的探测点)；
  3) assert-orca(核心): optimizer=on 应在 30s 内出计划(Optimizer: GPORCA)；
     assert-pg(对比/回归): optimizer=off 应立即出计划(Optimizer: Postgres query optimizer)。
expected: |
  - 两步 psql 退出 0，EXPLAIN 输出含对应 "Optimizer: GPORCA"(orca 步)/
    "Optimizer: Postgres query optimizer"(pg 步)——该行只在 EXPLAIN 计划生成完成后打印，
    即"没卡住"的确定性信号；不含 "canceling statement due to statement timeout"/"ERROR"
    (= 修复后行为)；
  - BUG 复现时 assert-orca 步：ORCA 计划生成爆炸、30s 内出不来 → statement_timeout 触发 →
    出现 "canceling statement due to statement timeout"、无 "Optimizer: GPORCA" → 红
    (optimizer=off 的 assert-pg 步始终绿)。

applies_to: {}
preconditions: {}
external_deps: []

defaults:
  database: gpadmin

sessions:                # 两步独立 session → 独立分组、并发跑、各自报告。两步各开独立
  pg: {driver: shell}    # psql 会话(TEMP 表必须与查询同会话)，互不影响。
  orca: {driver: shell}

setup:
  - su - gpadmin -c "psql -d gpadmin -c 'DROP DATABASE IF EXISTS bug0023_lgdb'"
