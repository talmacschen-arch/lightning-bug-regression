        proc_gr_id          text,
        proc_gr_nm_ary_ctn  text[],
        proc_id             text,
        proc_nm_ary_ctn     text[],
        isp_loc_ctn         text,
        eqp_gen_ctn         text,
        ctgr_cd             text,
