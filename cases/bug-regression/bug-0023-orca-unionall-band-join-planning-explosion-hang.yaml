  - name: "assert-pg（对比/回归）: optimizer=off 经典 planner 对同一查询应立即出计划"
    kind: shell
    "on": pg
    cmd: |
      su - gpadmin -c 'psql -d bug0023_lgdb -f -' 2>&1 <<'PGEOF'
      SET optimizer=off;
      DROP TABLE IF EXISTS APD_SUMMARY_IMAGE_DATA;
      CREATE TEMP TABLE APD_SUMMARY_IMAGE_DATA WITH (APPENDONLY=TRUE, COMPRESSTYPE=ZSTD, COMPRESSLEVEL=7)
      AS
      SELECT
             B.VALID_DATE
           , B.PROC_GR_ID
           , B.PLDO_CD
           , B.EQP_GR_ID
           , B.EQP_ID
           , B.ISP_EQP_ID
           , B.CTGR_CD
           , B.ISP_ATC_ID
           , B.CNT_ALL
           , B.CNT_Y
           , B.FROM_EVT_DTM::TIMESTAMP
           , B.TO_EVT_DTM::TIMESTAMP
        FROM (
          SELECT DATE_TRUNC('DAY', A.PERD_ST_DTM::TIMESTAMP) AS VALID_DATE
               , A.PROC_GR_ID
               , A.PLDO_CD
               , A.EQP_GR_ID
               , A.EQP_ID
               , A.ISP_EQP_ID
               , A.CTGR_CD
               , A.ISP_ATC_ID
               , SUM(A.ALL_CNT)     AS CNT_ALL
               , SUM(A.CHK_CNT)     AS CNT_Y
               , MIN(A.EVT_ST_DTM)  AS FROM_EVT_DTM
               , MAX(A.EVT_END_DTM) AS TO_EVT_DTM
            FROM ESAZ_MFG.TB_MSPCB_SPCP_VALD_SMRY_IMG_F A
           WHERE A.PERD_ST_DTM  >= '2026-08-01 00:00:00'   -- 기간 설정
             AND A.PERD_END_DTM <  '2026-08-02 00:00:00'   -- 기간 설정
           GROUP BY DATE_TRUNC('DAY', A.PERD_ST_DTM::TIMESTAMP)
                  , A.PROC_GR_ID
                  , A.PLDO_CD
                  , A.EQP_GR_ID
                  , A.EQP_ID
                  , A.ISP_EQP_ID
                  , A.CTGR_CD
                  , A.ISP_ATC_ID
        ) B
       WHERE 1=1
         AND PROC_GR_ID IN ('A')   -- 조건 설정
      DISTRIBUTED RANDOMLY;

      -- ★强烈建议: 让② 的范围 join 有统计可依 (对齐修复方案)
      ANALYZE APD_SUMMARY_IMAGE_DATA;
      ANALYZE APD_SUMMARY_IMAGE_DATA;
      SET optimizer=off;
      SET statement_timeout=30000;
