        fomt_ln_id        text,
        rlmp_yn           text,
        rlmp_uppr_sid_ctn text,
        vsn_isp_tp_cd     text,
        isp_loc_ctn       text,
        eqp_mdp_nm        text,
        asy_lane_no       text,
        eqp_gen_ctn       text,
