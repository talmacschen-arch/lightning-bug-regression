    ALTER TABLE esaz_mfg_m.tb_mspcb_spcp_isp_rlt_assy_hdr_mcc_%1$s_f ALTER COLUMN eqp_gr_nm_ary_ctn     SET STATISTICS 0;
    ALTER TABLE esaz_mfg_m.tb_mspcb_spcp_isp_rlt_assy_hdr_mcc_%1$s_f ALTER COLUMN vsn_isp_tp_nm_ary_ctn SET STATISTICS 0;
