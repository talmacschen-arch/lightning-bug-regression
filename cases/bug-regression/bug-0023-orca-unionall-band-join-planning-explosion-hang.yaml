         and a.evt_dtm >= '2026-08-01 00:00:00'::TIMESTAMP - INTERVAL '2' DAY
         and a.evt_dtm <  '2026-08-02 00:00:00'::TIMESTAMP + INTERVAL '3' DAY
         and a.evt_dtm >= DATE_TRUNC('day', a.crt_dtm::TIMESTAMP) - INTERVAL '2' DAY
         and a.del_yn  = 'N'
         and NULLIF(b.img_file_nm, '') != 'NA'
         and ( b.exst_yn in ('Y','I') OR NULLIF(b.exst_yn, '') IS NULL )
            ) t
            join APD_SUMMARY_IMAGE_DATA AP
              on  AP.ISP_EQP_ID = t.isp_eqp_id
              and AP.EQP_GR_ID  = t.eqp_gr_id
              and AP.EQP_ID     = t.eqp_id
              and AP.CTGR_CD    = t.ctgr_cd
              and AP.ISP_ATC_ID = t.isp_atc_id
              and t.evt_dtm     >= AP.FROM_EVT_DTM
              and t.evt_dtm     <= AP.TO_EVT_DTM
            join esaz_mfg.tb_mspcb_spcp_eqp_n e
              on  e.lang_id = 'ko-KR'
              and e.pldo_cd = t.pldo_cd
              and e.eqp_id  = t.isp_eqp_id
            left outer join esaz_mfg.tb_mspcb_spcp_eqp_mdp_n m
              on  m.lang_id    = e.lang_id
              and m.eqp_mdp_id = e.eqp_mdp_id
           ) t
       where 1=1
      /*ADD_DETAIL_QUERY_CONDITION*/
      ;
      PGEOF
    timeout_sec: 90
    expect:
      exit_code: 0
      stdout_contains:
        - "Optimizer: Postgres query optimizer"
      not_contains:
        - "canceling statement due to statement timeout"
        - "ERROR"

teardown:
  - su - gpadmin -c "psql -d gpadmin -c 'DROP DATABASE IF EXISTS bug0023_lgdb'"

created_by: chenqiang
created_at: "2026-08-11"
notes: |
  来源：飞书 wiki/PylNw7UXXi6xP2kXGagcFkXKnng（LG，2026-08-04）。表结构/语句①/语句② 按
  飞书文档第 3~6 节原样；11 段 UNION ALL 分支经核对**仅 nNN 后缀 + 分支注释序号不同**，
  由模板展开为字面内联（等价硬编、透明）。

  **空表复现**：根因是 GPORCA 计划生成(planning)阶段搜索空间爆炸，与数据量/统计无关，
  故 setup 只建表结构不造数；用 **EXPLAIN**(仅 planning)即可探测——正对应飞书"连 EXPLAIN
  都出不来"。EXPLAIN 完成才会打印末尾 "Optimizer: ..." 行，故以该行作为"没卡住"的确定性
  正向信号。

  **hang-bug 确定性检测**（见 [[lbr-hang-bug-test-pattern]]）：statement_timeout=30000(内,
  30s；含 planning 阶段) / timeout_sec=90(外 > 内 → 卡时得干净 FAIL 而非外层 ERROR)。修复态
  实测 ORCA planning ~1s、PG ~13ms，30s 给足余量；BUG 态 ORCA "无法返回"(join_order 变体
  仍 ~58s) 远超 30s → 超时 → 红。正面 expect = 修复后行为(design.md §4.1.1：红 = 仍有此 BUG)。

  **TEMP 表与查询必须同会话**：APD_SUMMARY_IMAGE_DATA 是 CREATE TEMP TABLE(会话级)，故每步
  在单个 psql -f - 会话里先建临时表(用 optimizer=off 快速建)再跑语句②。基表结构在 setup
  持久化到 bug0023_lgdb。

  **判定信号**：assert-orca 断 "Optimizer: GPORCA"(= EXPLAIN 计划生成完成且确实走 ORCA、
  非 fallback) + not_contains "canceling statement due to statement timeout"(卡住/超时信号)/
  "ERROR"。不锁 buggy 计划形态做门槛(见 [[lbr-hang-bug-test-pattern]] 反模式)。psql 报错在
  stderr，故 cmd 末尾 2>&1 并进 stdout(断言只读 stdout)。步骤 heredoc 用引号 <<'PGEOF'
  (零 shell 展开，SQL 里的 $ / 单引号 / 注释全字面安全)。

  **验证进展（诚实标注）**：2026-08-11 HashData Lightning **2.5.3 build 147934**：optimizer=on
  下语句② EXPLAIN **~1s 出计划**(Optimizer: GPORCA，Gather→Hash Join→11 分支 Append，band
  谓词折成 filter)，连跑 3 次稳定(976~1015ms)；optimizer=off ~13ms(Postgres planner)。均不
  卡、无 canceling → **BUG 不复现 = 已修复**(用户确认此版本已修，"片刻就能出来")。Try 两步
  全 pass。故 status=fixed。仅此 build 验证不复现，未在更早 build 实证复现，fixed_version
  记为"本 case 验证不复现的最早已知 build"。同源家族 [[lbr-bug0022-orca-1500-array-projection-hang]]
  / [[lbr-bug0021-plpgsql-exception-segworker]]（均 LG、esaz、optimizer on/off 差异类）。
