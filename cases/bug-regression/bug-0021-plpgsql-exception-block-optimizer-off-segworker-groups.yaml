            END IF;
            V_SQL := V_SQL ||'   AND T101.MDL_ID  IN ('''||V_MDL_LOT_ID||''')                             '||CHR(13);
            V_SQL := V_SQL ||'   AND T101.RUTG_ID IN ('''||V_RUTG_ID||''')                                '||CHR(13);
            V_SQL := V_SQL ||' ORDER BY SORT_ORD                                                          '||CHR(13);
            RAISE NOTICE '%', V_SQL;
            RETURN QUERY EXECUTE V_SQL;
        END IF;

        IF P_SRCH_TP_CD = 'CELL_ID' THEN
            V_SQL := ''||CHR(13);
            V_SQL := V_SQL ||'SELECT DISTINCT T101.CELL_ID::TEXT                              AS CODE     '||CHR(13);
            V_SQL := V_SQL ||'               ,T101.CELL_ID::TEXT                              AS NAME     '||CHR(13);
            V_SQL := V_SQL ||'               ,DENSE_RANK() OVER(ORDER BY T101.CELL_ID)::INT4   AS SORT_ORD '||CHR(13);
            V_SQL := V_SQL ||'               ,NULL::TEXT                                      AS PR_CODE  '||CHR(13);
            V_SQL := V_SQL ||'  FROM MFG_M.TB_QPQAB_ACV_CHGD_PRFL_LUP_D T101                              '||CHR(13);
            V_SQL := V_SQL ||' WHERE 1=1                                                                  '||CHR(13);
            V_SQL := V_SQL ||'   AND T101.PLDO_ID = '''||V_PLDO_CD||'''                                   '||CHR(13);
            V_SQL := V_SQL ||'   AND LOT_ST_DT BETWEEN TO_CHAR('''||P_START_DTM||'''::TIMESTAMP, ''YYYYMMDD'') AND TO_CHAR('''||P_END_DTM||'''::TIMESTAMP, ''YYYYMMDD'')'||CHR(13);
            V_SQL := V_SQL ||'   AND LOT_ST_DTM::TIMESTAMP BETWEEN '''||P_START_DTM||'''::TIMESTAMP AND '''||P_END_DTM||'''::TIMESTAMP'||CHR(13);
            IF P_LN_ID_ARY IS NOT NULL THEN
                V_SQL := V_SQL ||'   AND T101.LN_ID      IN ('''||V_LN_ID||''')                           '||CHR(13);
            END IF;
            IF P_RUTG_TP_CD_ARY IS NOT NULL THEN
                V_SQL := V_SQL ||'   AND T101.RUTG_TP_CD IN ('''||V_RUTG_TP_CD||''')                      '||CHR(13);
            END IF;
            V_SQL := V_SQL ||'   AND T101.MDL_ID  IN ('''||V_MDL_LOT_ID||''')                             '||CHR(13);
            V_SQL := V_SQL ||'   AND T101.RUTG_ID IN ('''||V_RUTG_ID||''')                                '||CHR(13);
            V_SQL := V_SQL ||'   AND T101.LOT_ID  IN ('''||V_LOT_ID||''')                                 '||CHR(13);
            V_SQL := V_SQL ||' ORDER BY SORT_ORD                                                          '||CHR(13);
            RAISE NOTICE '%', V_SQL;
            RETURN QUERY EXECUTE V_SQL;
        END IF;

        IF P_SRCH_TP_CD = 'TRAY_ID' THEN
            V_SQL := ''||CHR(13);
            V_SQL := V_SQL ||'SELECT DISTINCT T101.TRAY_ID::TEXT                              AS CODE     '||CHR(13);
            V_SQL := V_SQL ||'               ,T101.TRAY_NO::TEXT                              AS NAME     '||CHR(13);
            V_SQL := V_SQL ||'               ,DENSE_RANK() OVER(ORDER BY T101.TRAY_NO)::INT4   AS SORT_ORD '||CHR(13);
            V_SQL := V_SQL ||'               ,NULL::TEXT                                      AS PR_CODE  '||CHR(13);
            V_SQL := V_SQL ||'  FROM MFG_M.TB_QPQAB_ACV_CHGD_PRFL_LUP_D T101                              '||CHR(13);
            V_SQL := V_SQL ||' WHERE 1=1                                                                  '||CHR(13);
            V_SQL := V_SQL ||'   AND T101.PLDO_ID = '''||V_PLDO_CD||'''                                   '||CHR(13);
            V_SQL := V_SQL ||'   AND LOT_ST_DT BETWEEN TO_CHAR('''||P_START_DTM||'''::TIMESTAMP, ''YYYYMMDD'') AND TO_CHAR('''||P_END_DTM||'''::TIMESTAMP, ''YYYYMMDD'')'||CHR(13);
            V_SQL := V_SQL ||'   AND LOT_ST_DTM::TIMESTAMP BETWEEN '''||P_START_DTM||'''::TIMESTAMP AND '''||P_END_DTM||'''::TIMESTAMP'||CHR(13);
            IF P_LN_ID_ARY IS NOT NULL THEN
                V_SQL := V_SQL ||'   AND T101.LN_ID      IN ('''||V_LN_ID||''')                           '||CHR(13);
            END IF;
            IF P_RUTG_TP_CD_ARY IS NOT NULL THEN
