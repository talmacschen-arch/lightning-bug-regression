steps:
  - name: "assert-pg-planner（核心）: optimizer=off 经典 planner 调嵌套 EXCEPTION 函数查复制表应正常返回 13 行（修复后行为）"
    kind: shell
    "on": pg               # 必须给 key 加引号：YAML 1.1 裸 on 会被解析成布尔 true
    cmd: |
      su - gpadmin -c 'psql -d bug0021_lgdb -f -' 2>&1 <<'SQL'
      SET optimizer = off;
      SELECT CODE, name
          FROM esaz_mfg_m.f_fetch_acv_chgd_profile_data_djpark
              ('GRD_CD','ko-KR','MD',NULL,NULL,NULL,NULL,NULL,NULL,NULL,
               NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL)
          ORDER BY SORT_ORD;
      SQL
    timeout_sec: 120
    expect:
      exit_code: 0
      stdout_contains:
        - "1등급"
        - "L등급"
        - "(13 rows)"
      not_contains:
        - "ERROR"
        - "multiple segworker groups"

  - name: "assert-orca（回归）: optimizer=on ORCA 调同一函数应返回同样 13 行（历来正常，确认没被搞坏）"
    kind: shell
    "on": orca             # 同上，key 加引号避免被当布尔
    cmd: |
      su - gpadmin -c 'psql -d bug0021_lgdb -f -' 2>&1 <<'SQL'
      SET optimizer = on;
      SELECT CODE, name
          FROM esaz_mfg_m.f_fetch_acv_chgd_profile_data_djpark
              ('GRD_CD','ko-KR','MD',NULL,NULL,NULL,NULL,NULL,NULL,NULL,
               NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL)
          ORDER BY SORT_ORD;
      SQL
    timeout_sec: 120
    expect:
      exit_code: 0
      stdout_contains:
        - "1등급"
        - "L등급"
        - "(13 rows)"
      not_contains:
        - "ERROR"
        - "multiple segworker groups"

teardown:
  - su - gpadmin -c "psql -d gpadmin -c 'DROP DATABASE IF EXISTS bug0021_lgdb'"

created_by: chenqiang
created_at: "2026-08-10"
notes: |
  来源：飞书 wiki/Ov7PwTD3Bi164gkRYdnc9VMDnVc（LG 客户，2026-07-29）。表结构 / 三个
  函数 / 造数按飞书文档第 3 节「完整建表建函数造数脚本」原样内联，主查询/参数按第 4 节。

  **触发路径（三要素缺一不复现，实测已排除）**：
    - 把 f_get_name_djpark 直接放进普通 SELECT（不经外层函数）→ 不报错；
    - 必须经外层 f_fetch_acv_chgd_profile_data_djpark 的 RETURN QUERY EXECUTE 动态
      分发（GRD_CD 分支），且被查表是 DISTRIBUTED REPLICATED，且被调函数带 EXCEPTION
      块 → 经典 planner (optimizer=off) 才生成会被拒的「multiple segworker groups」计划。
    - 根因：EXCEPTION handler 的 BEGIN 块进入须建子事务，在 segment 分发上下文受限；
      ORCA (optimizer=on) 走另一路径可规避，从不复现。

  **判定信号**：
    - 正面 expect = 修复后行为（design.md §4.1.1：红 = 仍有此 BUG）。三个鉴别值
      "1등급"/"L등급"/"(13 rows)" 只在查询成功、13 行每行按 grd_nm 正确切出 ko-KR
      等级名时出现；BUG 复现时 optimizer=off 直接报 "multiple segworker groups"、
      无结果行 → 三值缺失 + 报错文案出现 → 红。
    - not_contains "multiple segworker groups" 是本 bug 的核心鉴别串；not_contains
      "ERROR"（大写）不会误命中 grd_nm 里的 "Grade"（首字母大写但非全大写 ERROR）。
    - psql 报错打在 stderr，故 cmd 末尾 2>&1 并进 stdout 才能被 not_contains 匹配到
      （断言只读 stdout，orchestrator.py:203-205），与 exit_code 形成多重信号。

  **两步独立 session（编排取舍）**：optimizer=off/on 各一步、各开独立 psql 连接、各 SET
  自己的 optimizer。放独立 session（sessions: {pg,orca} + "on":）→ 各自独立分组、并发
  跑、各自报告；否则同组「首个非 pass 即 break」会在一步失败时跳过另一步。YAML 1.1 坑：
  step 里的 on key 必须写成带引号 "on"，否则裸 on 被 PyYAML 解析成布尔 true、丢失分组。

  **为何走 kind: shell + psql -f - heredoc**：SET optimizer 与函数调用必须同会话；每步
  一次 psql 连接跑完 set+select。CREATE/DROP DATABASE 是 non-tx-safe 走 psql -c；对象+
  函数+数据用一条 psql -f - heredoc 灌进新库（ON_ERROR_STOP=1）。断言步不加 ON_ERROR_STOP，
  让 psql 即使 SET 后报错也把错误文案打出来供 not_contains 判定（退出码另判）。

  **主分发函数全量内联**：客户原函数 21KB、10 个 p_srch_tp_cd 分支，本 case 仅触达
  GRD_CD 分支；其它分支引用的表（COMMON.TB_MMDMB_MMD_LN_N / MFG_M.TB_QPQAB_... 等）
  不建、不执行（plpgsql 动态 EXECUTE 字符串在 CREATE 时不校验对象存在）。选择全量内联
  而非精简 wrapper：最大保真、绝不因精简漏掉触发路径（bug 已修复，无法在本 DUT 实证
  精简版仍能触发）。'₩'（韩文字体下显示的反斜杠）在本造数里不出现于 name 列，REPLACE
  为无操作，保留原样不影响 13 行结果。

  **判定语义 + 验证进展**：
    - 2026-08-10 HashData Lightning 2.5.3 build 147934：optimizer=off/on 均正常返回
      13 行（含 1등급/L등급），**BUG 不复现 = 已修复**（用户确认此版本已修）。故
      status=fixed、fixed_version=2.5.3 build 147934。
    - 注：仅在 2.5.3 build 147934 验证不复现；未在更早 build 上验证复现，fixed_version
      记为「本 case 验证不复现的最早已知 build」而非「首个修复 build」。与 bug-0020 同源
      家族（optimizer=off 经典 planner 路径的分发限制），可参照互查。
